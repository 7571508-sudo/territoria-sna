<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Территория Сна</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <i class="fas fa-cog"></i> Панель управления
            </div>
            <nav class="admin-nav">
                <a href="#" class="admin-nav-item active" data-page="products">
                    <i class="fas fa-box"></i> Товары
                </a>
                <a href="index.html" class="admin-nav-item">
                    <i class="fas fa-store"></i> На сайт
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1><i class="fas fa-box"></i> Управление товарами</h1>
                <button class="btn btn-primary" onclick="openProductModal()">
                    <i class="fas fa-plus"></i> Добавить товар
                </button>
            </header>

            <div class="admin-content">
                <div class="products-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Фото</th>
                                <th>Название</th>
                                <th>Артикул</th>
                                <th>Размер</th>
                                <th>Цена</th>
                                <th>Скидка</th>
                                <th>Наличие</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content admin-modal">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-plus-circle"></i> Добавить товар</h2>
                <button class="close-btn" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Название товара *</label>
                        <input type="text" id="productName" required placeholder="Территория сна Ариэль">
                    </div>
                    <div class="form-group">
                        <label>Артикул</label>
                        <input type="text" id="productArticle" placeholder="M0332310">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Цена (BYN) *</label>
                        <input type="number" id="productPrice" required step="0.01" min="0" placeholder="387.78">
                    </div>
                    <div class="form-group">
                        <label>Цена со скидкой (BYN)</label>
                        <input type="number" id="productSalePrice" step="0.01" min="0" placeholder="297.93">
                    </div>
                    <div class="form-group">
                        <label>Скидка (%)</label>
                        <input type="number" id="productDiscount" min="0" max="99" placeholder="23">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Размер</label>
                        <select id="productSize">
                            <option value="80x190">80x190 см</option>
                            <option value="90x190">90x190 см</option>
                            <option value="120x190">120x190 см</option>
                            <option value="140x200">140x200 см</option>
                            <option value="160x200">160x200 см</option>
                            <option value="180x200">180x200 см</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Жёсткость</label>
                        <select id="productHardness">
                            <option value="мягкий">Мягкий</option>
                            <option value="среднемягкий">Среднемягкий</option>
                            <option value="средний" selected>Средний</option>
                            <option value="среднежёсткий">Среднежёсткий</option>
                            <option value="жёсткий">Жёсткий</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Тип пружин</label>
                        <select id="productSpring">
                            <option value="независимые пружины" selected>Независимые пружины</option>
                            <option value="беспружинный">Беспружинный</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Количество зон</label>
                        <input type="number" id="productZones" min="1" max="11" value="5">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Высота (см)</label>
                        <input type="text" id="productHeight" value="18">
                    </div>
                    <div class="form-group">
                        <label>Макс. нагрузка (кг/место)</label>
                        <input type="text" id="productMaxLoad" value="100 кг">
                    </div>
                    <div class="form-group">
                        <label>Чехол</label>
                        <input type="text" id="productCover" value="трикотаж">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Описание</label>
                    <textarea id="productSpecs" rows="3" placeholder="независимые пружины, 7 зон, среднемягкий/среднежёсткий, 100 кг/место, высота: 16 см"></textarea>
                </div>

                <div class="form-group full-width">
                    <label>Фото товара</label>
                    <div class="image-upload-container">
                        <div class="image-preview" id="imagePreview">
                            <span>Нажмите для загрузки фото</span>
                        </div>
                        <input type="file" id="productImageFile" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                        <input type="hidden" id="productImage" value="">
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('productImageFile').click()">
                            <i class="fas fa-upload"></i> Загрузить с компьютера
                        </button>
                        <span class="or-text">или</span>
                        <input type="url" id="productImageUrl" placeholder="URL изображения" onchange="handleUrlInput(this.value)">
                    </div>
                    <small>Загрузите фото с ПК или вставьте URL</small>
                </div>

                <div class="form-group full-width">
                    <label class="checkbox-label">
                        <input type="checkbox" id="productInStock" checked>
                        <span>В наличии</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeProductModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="deleteModal">
        <div class="modal-content small-modal">
            <div class="modal-header">
                <h2><i class="fas fa-exclamation-triangle"></i> Удаление товара</h2>
                <button class="close-btn" onclick="closeDeleteModal()"><i class="fas fa-times"></i></button>
            </div>
            <p>Вы уверены, что хотите удалить товар "<span id="deleteProductName"></span>"?</p>
            <div class="form-actions">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Отмена</button>
                <button class="btn btn-danger" onclick="confirmDelete()">
                    <i class="fas fa-trash"></i> Удалить
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Сохранено!</span>
    </div>

        function getSupabaseClient() {
            if (!supabaseDbClient && window.supabaseJs) {
                supabaseDbClient = window.supabaseJs.createClient(supabaseUrl, supabaseKey);
            }
            return supabaseDbClient;
        }

        let products = [];

        async function loadProducts() {
            const client = getSupabaseClient();
            if (client) {
                try {
                    const { data, error } = await client.from('products').select('*').order('id');
                    if (data && data.length > 0) {
                        products = data;
                        localStorage.setItem('nexusProducts', JSON.stringify(products));
                        renderProductsTable();
                        return;
                    }
                } catch (e) {
                    console.log('Supabase error, using local');
                }
            }
            
            const localData = localStorage.getItem('nexusProducts');
            if (localData) {
                products = JSON.parse(localData);
            } else {
                products = [...defaultProducts];
                localStorage.setItem('nexusProducts', JSON.stringify(products));
            }
            renderProductsTable();
            
            if (client && products.length > 0) {
                for (const p of products) {
                    await client.from('products').upsert(p);
                }
            }
        }

        let deleteProductId = null;

        async function saveToStorage() {
            localStorage.setItem('nexusProducts', JSON.stringify(products));
            
            try {
                const productData = products.map(p => ({
                    ...p,
                    image: p.image && p.image.startsWith('http') ? p.image : ''
                }));
                
                for (const p of productData) {
                    await getSupabaseClient().from('products').upsert(p);
                }
            } catch (e) {
                console.error('Error saving to Supabase:', e);
            }
            
            showToast('Сохранено!');
        }

        function renderProductsTable() {
            const tbody = document.getElementById('productsTableBody');
            tbody.innerHTML = products.map(product => {
                const imageUrl = product.image || imageMap[product.size] || imageMap['80x190'];
                return `
                    <tr>
                        <td><img src="${imageUrl}" alt="${product.name}" class="product-thumb" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23666%22 width=%22100%22 height=%22100%22 rx=%2210%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2212%22>?</text></svg>'"></td>
                        <td class="product-name-cell">${product.name}</td>
                        <td>${product.article || '-'}</td>
                        <td>${product.size} см</td>
                        <td class="price-cell">
                            ${product.discount > 0 ? `<span class="price-old-cell">${product.price.toFixed(2)} BYN</span><br>` : ''}
                            ${product.salePrice ? product.salePrice.toFixed(2) : product.price.toFixed(2)} BYN
                        </td>
                        <td>${product.discount > 0 ? `<span class="badge badge-danger">-${product.discount}%</span>` : '-'}</td>
                        <td><span class="badge ${product.inStock ? 'badge-success' : 'badge-danger'}">${product.inStock ? 'В наличии' : 'Нет'}</span></td>
                        <td>

                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

        function openProductModal(productId = null) {
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            const title = document.getElementById('modalTitle');

            form.reset();
            document.getElementById('productId').value = '';

            if (productId) {
                const product = products.find(p => p.id === productId);
                if (product) {
                    title.innerHTML = '<i class="fas fa-edit"></i> Редактировать товар';
                    document.getElementById('productId').value = product.id;
                    document.getElementById('productName').value = product.name;
                    document.getElementById('productArticle').value = product.article || '';
                    document.getElementById('productPrice').value = product.price;
                    document.getElementById('productSalePrice').value = product.salePrice || '';
                    document.getElementById('productDiscount').value = product.discount || '';
                    document.getElementById('productSize').value = product.size;
                    document.getElementById('productHardness').value = product.hardness;
                    document.getElementById('productSpring').value = product.spring;
                    document.getElementById('productZones').value = product.zones;
                    document.getElementById('productHeight').value = product.height;
                    document.getElementById('productMaxLoad').value = product.maxLoad;
                    document.getElementById('productCover').value = product.cover;
                    document.getElementById('productSpecs').value = product.specs;
                    document.getElementById('productImage').value = product.image || '';
                    document.getElementById('productInStock').checked = product.inStock;
                }
            } else {
                title.innerHTML = '<i class="fas fa-plus-circle"></i> Добавить товар';
                document.getElementById('productInStock').checked = true;
            }

            modal.classList.add('show');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('show');
        }

        function saveProduct(e) {
            e.preventDefault();

            const id = document.getElementById('productId').value;
            const productData = {
                name: document.getElementById('productName').value,
                article: document.getElementById('productArticle').value,
                price: parseFloat(document.getElementById('productPrice').value) || 0,
                salePrice: parseFloat(document.getElementById('productSalePrice').value) || 0,
                discount: parseInt(document.getElementById('productDiscount').value) || 0,
                size: document.getElementById('productSize').value,
                hardness: document.getElementById('productHardness').value,
                spring: document.getElementById('productSpring').value,
                zones: parseInt(document.getElementById('productZones').value) || 1,
                height: document.getElementById('productHeight').value,
                maxLoad: document.getElementById('productMaxLoad').value,
                cover: document.getElementById('productCover').value,
                specs: document.getElementById('productSpecs').value,
                image: document.getElementById('productImage').value,
                inStock: document.getElementById('productInStock').checked,
                category: 'mattresses',
                color: '#667eea'
            };

            if (id) {
                const index = products.findIndex(p => p.id === parseInt(id));
                if (index !== -1) {
                    products[index] = { ...products[index], ...productData };
                    showToast('Товар обновлён!');
                }
            } else {
                productData.id = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push(productData);
                showToast('Товар добавлен!');
            }

            saveToStorage();
            renderProductsTable();
            closeProductModal();
        }

        function editProduct(id) {
            openProductModal(id);
        }

        function deleteProduct(id) {
            const product = products.find(p => p.id === id);
            if (product) {
                deleteProductId = id;
                document.getElementById('deleteProductName').textContent = product.name;
                document.getElementById('deleteModal').classList.add('show');
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('show');
            deleteProductId = null;
        }

        function confirmDelete() {
            if (deleteProductId) {
                products = products.filter(p => p.id !== deleteProductId);
                saveToStorage();
                renderProductsTable();
                showToast('Товар удалён!');
            }
            closeDeleteModal();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeProductModal();
                closeDeleteModal();
            }
        });

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                showToast('Файл слишком большой! Максимум 10MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('productImage').value = e.target.result;
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
            };
            reader.onerror = function() {
                showToast('Ошибка чтения файла');
            };
            reader.readAsDataURL(file);
        }

        function handleUrlInput(url) {
            document.getElementById('productImage').value = url;
            const preview = document.getElementById('imagePreview');
            if (url) {
                preview.innerHTML = '<img src="' + url + '" alt="Preview">';
            } else {
                preview.innerHTML = '<span>Нажмите для загрузки фото</span>';
            }
        }

        loadProducts();
